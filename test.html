<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wanjia Supermarket Test Site</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f7f7f5; color: #171717; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; padding: 20px; max-width: 1200px; margin: auto; }
        .product { background: #fff; border: 1px solid #e9e9e9; border-radius: 16px; padding: 15px; text-align: center; }
        .price { font-size: 17px; font-weight: 900; color: #c9182b; margin: 10px 0; }
        .add-to-cart-btn { width: 100%; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .product:hover .add-to-cart-btn { background: #c9182b !important; }
    </style>
</head>
<body>

<h2 style="text-align: center; margin-top: 40px;">Wanjia Product Catalog Test</h2>

<div class="grid">
    <!-- Item 1: Real Active Price -->
    <article class="product" data-name="达利园派 巧克力">
        <h3>达利园派 巧克力</h3>
        <div class="price">RM9.00</div>
        <div class="pbody"></div>
    </article>

    <!-- Item 2: Pending Price Block -->
    <article class="product" data-name="好丽友派 抹茶">
        <h3>好丽友派 抹茶</h3>
        <div class="price">价格待更新</div>
        <div class="pbody"></div>
    </article>
</div>

<!-- Built-In Floating Shopping Cart Panel Layout Elements -->
<div id="cart-icon-btn" style="position: fixed; bottom: 30px; right: 30px; background: #c9182b; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10000;" onclick="toggleCart()">
    🛒 <span id="cart-badge" style="position: absolute; top: -5px; right: -5px; background: #171717; color: white; font-size: 12px; font-weight: bold; padding: 3px 7px; border-radius: 50%;">0</span>
</div>

<div id="cart-panel" style="position: fixed; top: 0; right: -400px; width: 380px; height: 100%; background: white; box-shadow: -5px 0 25px rgba(0,0,0,0.15); z-index: 20000; transition: 0.3s ease; display: flex; flex-direction: column;">
    <div style="padding: 20px; background: #171717; color: white; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0;">Shopping Cart</h3>
        <button onclick="toggleCart()" style="background: none; border: none; color: white; font-size: 22px; cursor: pointer;">✕</button>
    </div>
    <div id="cart-items-list" style="flex: 1; overflow-y: auto; padding: 20px;">
        <p id="empty-cart-msg" style="color: #888; text-align: center; margin-top: 40px;">Your cart is empty.</p>
    </div>
    <div style="padding: 20px; border-top: 1px solid #eee; background: #fafafa;">
        <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 15px;">
            <span>Total:</span>
            <span id="cart-total-price" style="color: #c9182b;">RM0.00</span>
        </div>
        <button style="width: 100%; background: #c9182b; color: white; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer;">Checkout</button>
    </div>
</div>

<script>
let cart = [];

function toggleCart() {
    const panel = document.getElementById('cart-panel');
    if (panel) {
        panel.style.right = (panel.style.right === '0px') ? '-400px' : '0px';
    }
}

function addToCart(name, price) {
    if (price === 0) {
        alert("This item's price is pending update!");
        return;
    }
    const existing = cart.find(item => item.name === name);
    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({ name: name, price: price, quantity: 1 });
    }
    updateCartUI();
    const panel = document.getElementById('cart-panel');
    if (panel) panel.style.right = '0px';
}

function changeQuantity(name, change) {
    const item = cart.find(item => item.name === name);
    if (item) {
        item.quantity += change;
        if (item.quantity <= 0) cart = cart.filter(i => i.name !== name);
    }
    updateCartUI();
}

function updateCartUI() {
    const listContainer = document.getElementById('cart-items-list');
    const badge = document.getElementById('cart-badge');
    const totalElement = document.getElementById('cart-total-price');
    
    listContainer.innerHTML = '';
    let totalItems = 0, totalPrice = 0;
    
    if (cart.length === 0) {
        listContainer.innerHTML = '<p style="color: #888; text-align: center;">Your cart is empty.</p>';
    } else {
        cart.forEach(item => {
            totalItems += item.quantity;
            totalPrice += item.price * item.quantity;
            listContainer.insertAdjacentHTML('beforeend', `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
                    <div><strong>${item.name}</strong><br><span style="color: #c9182b;">RM${(item.price * item.quantity).toFixed(2)}</span></div>
                    <div>
                        <button onclick="changeQuantity('${item.name}', -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeQuantity('${item.name}', 1)">+</button>
                    </div>
                </div>
            `);
        });
    }
    badge.innerText = totalItems;
    totalElement.innerText = `RM${totalPrice.toFixed(2)}`;
    syncProductButtons();
}

function syncProductButtons() {
    document.querySelectorAll('.product').forEach(product => {
        const pbody = product.querySelector('.pbody');
        const name = product.getAttribute('data-name');
        const priceText = product.querySelector('.price').innerText;
        
        let priceVal = 0;
        const numericText = priceText.replace(/[^\d.]/g, '');
        if (numericText && !isNaN(parseFloat(numericText))) priceVal = parseFloat(numericText);

        let button = pbody.querySelector('.add-to-cart-btn');
        if (!button) {
            button = document.createElement('button');
            button.className = 'add-to-cart-btn';
            button.onclick = () => addToCart(name, priceVal);
            pbody.appendChild(button);
        }

        const cartItem = cart.find(item => item.name === name);
        if (cartItem && cartItem.quantity > 0) {
            button.innerText = `In Cart: ${cartItem.quantity} ✓`;
            button.style.background = '#c9182b';
        } else {
            button.innerText = '+ Add to Cart';
            button.style.background = '#171717';
        }
    });
}

setTimeout(syncProductButtons, 300);
</script>
</body>
</html>
